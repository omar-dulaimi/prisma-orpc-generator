name: Semantic Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      packages: write
      pull-requests: write
      # Required. @semantic-release/npm requests a GitHub OIDC token and exchanges it with npm for a
      # short-lived publish credential; without this the exchange fails and there is no token to fall
      # back on, because the package disallows them.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.10.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, lint, typecheck, and test
        run: |
          pnpm run build
          pnpm run typecheck
          pnpm run lint
          pnpm run test

      # No npm token: the package is configured for Trusted Publishing with tokens disallowed, so
      # auth is the OIDC exchange alone. Setting NPM_TOKEN here would write a conflicting .npmrc.
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run release
